name: make-video

on:
  repository_dispatch:
    types: [make-video]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + Hindi font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Render video
        env:
          PAYLOAD: ${{ github.event.client_payload.raw }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python render.py

      - name: Publish video as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_id }}" out/video.mp4 --title "v${{ github.run_id }}" --notes "auto-generated"

      - name: Send result to Make
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v${{ github.run_id }}/video.mp4"
          jq -c --arg url "$URL" --arg chat "$CHAT_ID" '. + {video_url: $url, chat_id: $chat}' out/meta.json > payload.json
          curl -sS --fail -X POST "$MAKE_WEBHOOK_URL" -H "Content-Type: application/json" -d @payload.json
