name: make-video

on:
  repository_dispatch:
    types: [make-video]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHAT_ID: ${{ github.event.client_payload.chat_id }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + Hindi font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Render video
        env:
          PAYLOAD: ${{ github.event.client_payload.raw }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python render.py

      - name: Keep a copy (download from Actions page if needed)
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
          retention-days: 3

      - name: Send video to Telegram
        run: |
          CAPTION=$(jq -r '"🎬 " + .title + "\n\n" + ((.description // "")[0:700])' out/meta.json)
          curl -sS --fail -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F chat_id="$CHAT_ID" \
            -F video=@out/video.mp4 \
            -F supports_streaming=true -F width=1080 -F height=1920 \
            --form-string caption="$CAPTION"

      - name: Tell user if something failed
        if: failure()
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode text="❌ Video nahi ban payi. Log yahan dekho: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
